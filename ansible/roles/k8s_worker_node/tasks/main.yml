---
- name: Check if node is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: k8s_kubelet_conf

- name: Join worker node to the cluster
  ansible.builtin.command:
    cmd: "{{ hostvars[groups['k8s_master'][0]]['kubernetes_join_command'] }}"
  when:
    - not k8s_kubelet_conf.stat.exists
    - hostvars[groups['k8s_master'][0]]['kubernetes_join_command'] is defined
    - hostvars[groups['k8s_master'][0]]['kubernetes_join_command'] | length > 0
  register: kubeadm_join

- name: Show kubeadm join output
  ansible.builtin.debug:
    var: kubeadm_join.stdout_lines
  when: kubeadm_join is changed
